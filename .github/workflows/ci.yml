name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  js-test-and-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      # rust-toolchain.toml pins the channel; cache cargo deps for build:lib (gen-binds)
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: js-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            js-${{ runner.os }}-

      - name: Setup Rust (for lib binding generation)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-22
          components: rustfmt

      - run: npm install
      - run: deno fmt --check
      - run: deno lint
      - run: npm run type-check
      - run: npm run test

  rust-linter:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-22
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-lint-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-lint-${{ runner.os }}-

      - name: Format
        run: cargo fmt -- --check

      - name: Linter
        run: cargo clippy --locked --all-targets -- -D warnings

  rust-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-22

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-test-${{ runner.os }}-

      - run: cargo test --locked --verbose
