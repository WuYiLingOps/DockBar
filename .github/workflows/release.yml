name: "Release"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  continuous-integration:
    uses: ./.github/workflows/ci.yml

  get-version:
    needs: continuous-integration
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: get-version
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            return packageJson.version;

  create-release:
    needs: get-version
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Create release (draft)
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = "${{ needs.get-version.outputs.version }}";
            const changelogContent = fs.readFileSync('changelog.md', 'utf-8');
            const regex = new RegExp(`(?<=\\[${version}\\]\\s)([\\s\\S]*?)(?=\\s## \\[)`, 'g');
            const releaseNotes = changelogContent.match(regex)?.[0].trim() || '';

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `DockBar v${version}`,
              body: releaseNotes,
              generate_release_notes: true,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build-binaries:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: windows-2025
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-22
          targets: ${{ matrix.target }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-build-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-build-${{ matrix.target }}-${{ runner.os }}-

      - name: Install frontend dependencies & Gen Core Lib
        run: npm install

      # Keyless build: no update server, no signing keys. NSIS installers are
      # bundled directly; integrity is checksum-based (no minisign signature).
      - name: Build (no bundle)
        run: npx tauri build --ci --verbose --no-bundle --target ${{ matrix.target }}

      - name: Upload binaries to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/static/**/*
            target/${{ matrix.target }}/release/*.exe
            target/${{ matrix.target }}/release/SHA256SUMS
            target/${{ matrix.target }}/release/SHA256SUMS.sig
            target/${{ matrix.target }}/release/dockbar.pdb

  bundle:
    needs:
      - get-version
      - build-binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: windows-2025
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-22
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-bundle-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-bundle-${{ matrix.target }}-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: target/${{ matrix.target }}/release

      - name: Clean bundle folder from cache
        shell: pwsh
        run: |
          $bundlePath = "target/${{ matrix.target }}/release/bundle"
          if (Test-Path $bundlePath) {
            Remove-Item -Path $bundlePath -Recurse -Force
            Write-Output "Old bundles files deleted: $bundlePath"
          }

      # Ship with a pinned WebView2 Fixed Version Runtime instead of the
      # evergreen installer; the script rewrites webviewInstallMode in
      # tauri.conf.json and leaves the runtime under src/runtime/<version>.
      - name: Set Fixed Runtime
        shell: pwsh
        run: |
          $arch = "${{ matrix.target }}".Contains("aarch64") ? "arm64" : "x64"
          ./scripts/SetFixedRuntime.ps1 -Architecture $arch

      - name: Bundle
        run: npx tauri bundle --ci --verbose --target ${{ matrix.target }} --no-binary-patching

      - name: Upload bundles to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle

  merge-bundles:
    needs: bundle
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload-merged.outputs.artifact-id }}
    steps:
      - name: Merge artifacts
        id: upload-merged
        uses: actions/upload-artifact/merge@v4
        with:
          name: bundles
          pattern: bundles-*
          delete-merged: true

  upload-bundles:
    needs:
      - create-release
      - merge-bundles
    runs-on: ubuntu-latest
    steps:
      - name: Download merged bundles
        uses: actions/download-artifact@v4
        with:
          name: bundles
          path: bundles

      - name: File Tree
        run: tree bundles

      # Keyless release: installers are uploaded as-is, no updater signatures.
      - name: Upload Installers to release
        uses: svenstaro/upload-release-action@v2
        with:
          release_id: ${{ needs.create-release.outputs.release_id }}
          file: bundles/**/*
          file_glob: true

  publish-release:
    needs: [create-release, upload-bundles]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release (un-draft)
        uses: actions/github-script@v7
        env:
          releaseId: ${{ needs.create-release.outputs.release_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.releaseId,
              draft: false,
            });
