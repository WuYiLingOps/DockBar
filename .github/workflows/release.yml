name: Release

# 推送 v* tag 时自动构建 NSIS 安装包（x64 / arm64）并发布 GitHub Release；
# 也可在 Actions 页手动触发（仅构建，产物上传 artifact 不发版）。
# 参考 dockpilot 的单 job 模式：tauri-action 在同一 job 内完成编译、打包、
# 发布，避免跨 job 搬运二进制与草稿/发布两段式带来的复杂度。
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: windows-2025
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-22
          targets: ${{ matrix.target }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.target }}

      - name: Install frontend dependencies & Gen Core Lib
        run: npm install

      # WebView2 走 Evergreen 引导安装（tauri.conf.json webviewInstallMode
      # embedBootstrapper）：安装包不打包固定版运行时，安装时检测系统
      # WebView2，缺失时由内嵌引导器联网安装（Win10/11 绝大多数已自带）。

      # 从 changelog.md 提取 `## [version]` 段作为发布说明（多行内容经
      # 定界符写入 $GITHUB_OUTPUT，供 tauri-action 的 releaseBody 引用）
      - name: Generate release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HEADER="## [$VERSION]"
          awk -v header="$HEADER" '
            index($0, header) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' changelog.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "未在 changelog.md 中找到 ${VERSION} 的说明段落" >&2
            echo "- 首个发布版本" > release_notes.md
          fi
          {
            echo 'body<<NOTES_EOF'
            cat release_notes.md
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # Keyless build: no update server, no signing keys. Integrity is
      # checksum-based (no minisign signature). tauri-action builds, bundles
      # and (on tag pushes) creates the release with the notes above.
      # 每个架构产出两个安装包：轻量版（默认 embedBootstrapper）+ 离线版
      # （tauri.offline.conf.json 覆盖为 offlineInstaller，内嵌离线运行时），
      # 两者共存于同一 bundle 目录，由 tauri-action 一并上传 Release。
      - name: Build and release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DockBar ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      # 离线版复用已编译产物（源码未变，cargo 增量为空转），只重新执行
      # NSIS 打包。webviewInstallMode 不影响产物命名，第二遍打包会生成与
      # 轻量版同名的 *-setup.exe（tauri-action 已先上传轻量版，工作区覆盖
      # 不影响 Release），因此这里打包后立即重命名加 -offline- 中缀再上传。
      - name: Bundle and upload offline installer (tag build)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx tauri build --ci --target ${{ matrix.target }} --config src/tauri.offline.conf.json --bundles nsis
          $bundleDir = "target/${{ matrix.target }}/release/bundle/nsis"
          $exe = Get-ChildItem "$bundleDir/*-setup.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "offline installer not found in $bundleDir"
          }
          $offlineName = $exe.Name -replace '-setup\.exe$', '-offline-setup.exe'
          Rename-Item $exe.FullName $offlineName
          gh release upload "$env:GITHUB_REF_NAME" "$bundleDir/$offlineName" --clobber

      # 手动触发走完整构建（含打包）做验证，不发版；产物可在本次运行页面的 Artifacts 下载
      - name: Build only (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: npx tauri build --ci --target ${{ matrix.target }}

      - name: Bundle offline installer (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: npx tauri build --ci --target ${{ matrix.target }} --config src/tauri.offline.conf.json --bundles nsis

      - name: Upload bundles to artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle
          if-no-files-found: error
