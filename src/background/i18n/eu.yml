auth:
  login_failed_body: >-
    Arazoren bat izan da saioa hastean. Honek jarraitzen badu, ziurtatu Windows
    'Credential Manager' zerbitzua (VaultSvc) gaituta eta martxan dagoela, eta
    saiatu berriro.
  login_failed_title: Ezin izan da saioa hasi
cancel: Indargabetu
done: Egin
elevated:
  description: >-
    DockBar administratzaile-pribilegioekin exekutatzen ari da.

    Honek ez du ezaugarririk gehitzen edo hobetzen, eta segurtasun arriskua sor
    dezake.

    Segurtasun hobea lortzeko, mesedez berrabiarazi administratzaile baimenik
    gabe.
  title: Administratzaile gisa exekutatzen
file_explorer: Fitxategien arakatzailea
resource:
  added: Baliabide berri bat gehitu da
  download_failed_body: >-
    Zerbait gaizki joan da baliabidea deskargatzean, jakinarazi DockBar
    garatzaileen taldeari.
  download_failed_title: Baliabideen deskargak huts egin du
  downloading: Aktiboak deskargatzen ...
  downloading_body: Honek segundo batzuk iraun ditzake, mesedez, ez itxi leihoa.
  enable: Ahalbidetu
  login_required_action: Hasi saioa
  login_required_body: Baliabide hau deskargatzeko saioa hasi behar duzu.
  login_required_title: Saioa hasi behar da
runtime:
  corrupted_data: Hondatutako datuak
  corrupted_file: >-
    Konfigurazio fitxategia hondatuta dago, horren ordez balio lehenetsiak
    erabiliz.
  corrupted_file_path: Fitxategiaren bide hondatua
  download: Joan deskarga orrira
  files_integrity: >-
    Ezin izan dugu egiaztatu aplikazioaren fitxategien osotasuna.

    Hau gerta daiteke fitxategiak aldatu, hondatuta edo instalazioa osatu gabe
    badago.

    Segurtasun arrazoiengatik, DockBar ezin da jarraitu.

    Mesedez, berriro instalatu webgune ofizialetik.
  files_integrity_title: Segurtasun alerta - Huts egin du fitxategien osotasuna egiaztatzea
  not_found: WebView2 Runtime ez da aurkitu
  not_found_description: DockBar-k Webview2 Runtime behar du. Mesedez, instala ezazu.
  outdated: WebView2 Exekuzio-denbora zaharkituta dago
  outdated_description: >-
    DockBar-k Webview2 Runtime %{min_version} edo handiagoa behar du. Mesedez,
    eguneratu.
service:
  not_running: DockBar Zerbitzua ez dago martxan
  not_running_description: >-
    DockBar Zerbitzua (slu-zerbitzua) menpekotasun/laguntzailea da aplikazioak
    behar bezala funtziona dezan.
  not_running_ok: Hasi zerbitzua
shortcut:
  conflicts:
