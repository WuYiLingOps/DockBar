    review: Berrikuspena
    title: Lasterbideen gatazkak hauteman dira
  register:
    placeholder: Sakatu edozein tekla konbinazio
    title: Lasterbide berria erregistratzea
widget_liveness:
  failed_description: |-
    '%{widget_name}' widgetak gehiegitan erantzuteari utzi zion.

    Aplikazioa berrabiarazten saia zaitezke.
  failed_title: Widgetaren errorea
