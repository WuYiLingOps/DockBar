  ok: අපි පටන් ගනිමු!
  review: ඔබ DockBar භාවිතා කිරීමට කැමති නම්, ගබඩාවේ සමාලෝචනයක් තැබීමට සලකා බලන්න - ඔබේ ප්‍රතිපෝෂණය ව්‍යාපෘතිය වර්ධනය වීමට සහ වැඩිදියුණු කිරීමට උපකාරී වේ.
